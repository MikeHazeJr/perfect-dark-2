# Perfect Dark 2 (fork) CI -- builds the actual fork targets on the actual
# branch and RUNS the unit-test suite. This is distinct from the upstream
# .github/workflows/c-cpp.yml, which targets the original decomp (i686 / Switch /
# multi-OS packaging on the `port` branch) and runs no tests. PC-only x86_64
# MinGW build via the same Ninja/CMake path devtools/build-headless.ps1 uses.
name: PD2 CI

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

# Keep only the newest in-flight run per branch; cancel superseded pushes.
concurrency:
  group: pd2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build (MinGW x86_64) + unit tests
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Set up MSYS2 / MINGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          # Mirrors the toolchain devtools/build-headless.ps1 expects, plus the
          # find_package() deps in CMakeLists.txt (SDL2, zlib, curl) and the
          # optional voice codec (opus) so HAVE_OPUS is exercised in CI.
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-python
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-opus

      - name: Checkout
        uses: actions/checkout@v4

      # The 2.0 renderer's bgfx, bx and bimg sources: pinned shallow submodules
      # (context/designs/rendering/bgfx-classic-gl.md). Fetched with the same
      # Windows git that checked out the repo; tools/recomp is not needed here.
      - name: Fetch the pinned bgfx sources
        shell: pwsh
        run: git submodule update --init --depth 1 -- third_party/bgfx/bx third_party/bgfx/bimg third_party/bgfx/bgfx

      - name: Check MinGW dependency resolution
        run: |
          python tools/tests/test_mingw_dependencies.py
          python -B tools/tests/test_native_write_policy_guard.py

      - name: Check modder workflow regressions
        run: python -B tools/tests/test_pdxxx_modder_workflow.py -v

      # B-1124: a multi-process smoke fixture that shares one install and passes
      # neither --portable nor --savedir runs against the real user profile.
      - name: Check smoke fixture isolation
        run: python -B tools/tests/test_smoke_fixture_isolation.py -v

      - name: Check isolated smoke storage contracts
        # Match the native Windows interpreter required by Storage-Harness.ps1.
        shell: pwsh
        run: |
          python -c "import os, sys, sysconfig; print(f'Storage Python: {sys.executable} ({sysconfig.get_platform()})'); assert os.name == 'nt' and not sysconfig.get_platform().startswith('mingw'), 'Storage contracts require native Windows CPython'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tools/smoke-verify/test-storage.py

      - name: Check read-only smoke reuse and runtime refusal
        shell: pwsh
        run: |
          python -B tools/smoke-verify/test-storage-reuse.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/smoke-verify/test-storage-reuse.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/smoke-verify/test-storage-reuse.ps1

      - name: Configure (CMake + Ninja)
        run: cmake -G Ninja -B Build .

      - name: Review configured native write routes
        run: python -B tools/native_write_policy_guard.py --compile-commands Build/compile_commands.json

      # `pd` pulls in the pd_headers codegen (add_custom_target ... ALL) as a
      # dependency, so no separate generate step is needed. pd-tests links the
      # port/game sources under test.
      - name: Build client + tests
        run: cmake --build Build --target pd pd-tests -j

      # The wrap list above covers bgfx's objects at link time; this reviews
      # the library loads it cannot, and the linked client's imports and DLL
      # names (D6: never AMD AGS, NVAPI or RenderDoc).
      - name: Review the bgfx dependency
        run: python -B tools/bgfx_dependency_audit.py --compile-commands Build/compile_commands.json --exe Build/PerfectDark.exe

      # SP-75 (context/systemic-bugs.md): `bool` is `#define bool s32` in C but
      # one byte after <stdbool.h> and in C++. Preprocess every file of both
      # targets and fail on a declaration seen with two widths, a C file whose
      # own code runs with a flipped bool, or a push_macro scope that leaks.
      # Runs after the build so generated headers exist.
      - name: Check bool layout (SP-75)
        run: |
          python -B tools/tests/test_bool_layout_audit.py
          python -B tools/bool_layout_audit.py --compile-commands Build/compile_commands.json --target pd
          python -B tools/bool_layout_audit.py --compile-commands Build/compile_commands.json --target pd-tests

      - name: Run unit tests
        run: |
          Build/PerfectDark.exe --reuse-write-policy-info
          exe="$(find Build -maxdepth 3 -name 'pd-tests.exe' | head -n1)"
          if [ -z "$exe" ]; then echo "pd-tests.exe not found under Build/"; exit 1; fi
          echo "Running $exe"
          "$exe" --reporter compact

      - name: Upload client artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PerfectDark-x86_64-windows
          path: Build/PerfectDark.exe
          if-no-files-found: warn
          retention-days: 7
