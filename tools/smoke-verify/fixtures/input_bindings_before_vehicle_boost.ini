# Smoke fixture (B-1233): the complete default bindings a build wrote before the Vehicle Boost
# action existed: 12 contexts of 123 actions, the last one GunRollRight. Made from the file a
# clean install of week-pd/mods 2fdbb7f8 wrote, without its 12 VehicleBoost rows.
