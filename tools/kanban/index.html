    <div id="modal-st-list"></div>

    <div class="modal-actions">
      <button class="btn btn-danger btn-sm" id="modal-delete-btn" onclick="deleteCard()">Delete</button>
      <span class="modal-spacer"></span>
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary btn-sm" onclick="saveCard()">Save</button>
    </div>
  </div>
</div>

<!-- Settings panel -->
<div id="settings-panel">
  <div class="settings-head">
    <h3>Settings</h3>
    <button class="settings-close" onclick="closeSettings()">x</button>
  </div>
  <div class="settings-sort">
    <div class="settings-sort-hd">Sorting</div>
    <div class="toggle-row">
      <label for="auto-sort-toggle">Auto-sort by priority</label>
      <label class="toggle-switch">
        <input type="checkbox" id="auto-sort-toggle" onchange="toggleAutoSort(this.checked)">
        <div class="toggle-track"></div>
        <div class="toggle-knob"></div>
      </label>
    </div>
    <div class="toggle-note">When on, Critical cards rise to the top. Drag to override within a priority tier.</div>
  </div>
  <div class="pillar-list" id="pillar-list">
    <div class="settings-pillars-hd">Pillars</div>
  </div>
  <div class="settings-foot">
    <h4>Add Pillar</h4>
    <div class="add-pillar-form">
      <input type="text" id="new-pillar-name" placeholder="Pillar name" autocomplete="off">
      <div class="add-pillar-row">
        <input type="color" id="new-pillar-color" value="#6366f1">
        <button class="btn btn-primary btn-sm" onclick="addPillar()">Add</button>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';

// ---------- constants ----------

const PRIORITY = {
  1: {label: 'Critical', short: 'CRIT', color: '#ef4444'},
  2: {label: 'High',     short: 'HIGH', color: '#f97316'},
  3: {label: 'Medium',   short: 'MED',  color: '#eab308'},
  4: {label: 'Low',      short: 'LOW',  color: '#3b82f6'},
  5: {label: 'Someday',  short: 'SMDY', color: '#94a3b8'}
};

const ST_COLORS = {
  backlog: '#94a3b8',
  active:  '#3b82f6',
  blocked: '#ef4444',
  done:    '#22c55e'
};

const ST_CYCLE = ['backlog', 'active', 'done', 'blocked'];

const COLS = {backlog:'Backlog', active:'Active', blocked:'Blocked', done:'Done'};

const FLAG_CONFIG = {
  star:  {icon: '★', color: '#f59e0b', label: 'Star',  cls: 'flag-star'},
  alert: {icon: '!',      color: '#ef4444', label: 'Alert', cls: 'flag-alert'},
  watch: {icon: '●', color: '#8b5cf6', label: 'Watch', cls: 'flag-watch'}
};
const FLAG_CYCLE = [null, 'star', 'alert', 'watch'];

// ---------- state ----------

let state = null;
let draggedId = null;
let dropTarget = null;
let draggedSubId = null;   // "cardId:subtaskId"
let subDropTarget = null;  // {cardId, beforeSubId}
let filterPillars = new Set();
let filterFlaggedOnly = false;
let editingCardId = null;
let saveTimer = null;
let inlineEditingPillarId = null;

const collapseState = (() => {
  try { return JSON.parse(localStorage.getItem('pd2kb-collapse') || '{}'); } catch { return {}; }
})();

const expandedCards = new Set(
  (() => { try { return JSON.parse(localStorage.getItem('pd2kb-expanded') || '[]'); } catch { return []; } })()
);

function saveExpandedState() {
  localStorage.setItem('pd2kb-expanded', JSON.stringify([...expandedCards]));
}

// ---------- utils ----------

function newId() {
  return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function getPillar(id) { return state.pillars.find(p => p.id === id) || null; }
function pillarColor(id) { const p = getPillar(id); return p ? p.color : '#94a3b8'; }
function now() { return new Date().toISOString(); }

function getCard(id) { return state.cards.find(c => c.id === id) || null; }

function sortedCards(cards) {
  const auto = state.settings && state.settings.autoSortPriority;
  return [...cards].sort((a, b) => {
    if (auto) {
      const pa = a.priority || 3, pb = b.priority || 3;
      if (pa !== pb) return pa - pb;
    }
    return a.order - b.order;
  });
}

function subtaskProgress(card) {
  const sts = card.subtasks;
  if (!sts || sts.length === 0) return null;
  return {done: sts.filter(s => s.status === 'done').length, total: sts.length};
}

// ---------- API ----------

async function loadState() {
  const r = await fetch('/api/state');
  state = await r.json();
  if (!state.settings) state.settings = {autoSortPriority: false};
  render();
}

function scheduleSave() {
  clearTimeout(saveTimer);
  setSaveStatus('saving', 'saving...');
  saveTimer = setTimeout(async () => {
    try {
      await fetch('/api/state', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(state, null, 2)
      });
      setSaveStatus('saved', 'saved');
      setTimeout(() => setSaveStatus('', ''), 1800);
    } catch { setSaveStatus('', 'save failed'); }
  }, 400);
}

function setSaveStatus(cls, msg) {
  const el = document.getElementById('save-status');
  el.className = cls; el.textContent = msg;
}

// ---------- render ----------

function render() { renderFilters(); renderBoard(); renderPillarList(); }

function renderFilters() {
  const bar = document.getElementById('filters');
  bar.innerHTML = '';
  const lbl = document.createElement('span');
  lbl.className = 'filter-label'; lbl.textContent = 'Pillar:';
  bar.appendChild(lbl);
  for (const p of state.pillars) {
    const btn = document.createElement('button');
    btn.className = 'pillar-btn' + (filterPillars.has(p.id) ? ' active' : '');
    btn.textContent = p.name;
    btn.style.borderColor = p.color;
    btn.style.color = filterPillars.has(p.id) ? 'white' : p.color;
    btn.style.background = filterPillars.has(p.id) ? p.color : 'transparent';
    btn.onclick = () => toggleFilter(p.id);
    bar.appendChild(btn);
  }
  if (filterPillars.size > 0) {
    const clr = document.createElement('button');
    clr.className = 'btn-clear-filter'; clr.textContent = 'Clear';
    clr.onclick = () => { filterPillars.clear(); render(); };
    bar.appendChild(clr);
  }

  const flagBtn = document.createElement('button');
  flagBtn.className = 'flag-filter-btn' + (filterFlaggedOnly ? ' active' : '');
  flagBtn.textContent = filterFlaggedOnly ? '★ Flagged only' : '★ Flagged';
  flagBtn.title = filterFlaggedOnly ? 'Show all cards' : 'Show flagged cards only';
  flagBtn.onclick = () => { filterFlaggedOnly = !filterFlaggedOnly; render(); };
  bar.appendChild(flagBtn);
}

function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  for (const colId of state.columns) board.appendChild(buildColumn(colId));
}

function buildColumn(colId) {
  const allCards = sortedCards(state.cards.filter(c => c.column === colId));
  const visibleCards = allCards.filter(c =>
    (filterPillars.size === 0 || filterPillars.has(c.pillar)) &&
    (!filterFlaggedOnly || !!c.flag)
  );

  const col = document.createElement('div');
  col.className = 'column' + (collapseState[colId] ? ' collapsed' : '');
  col.dataset.col = colId;

  const hd = document.createElement('div');
  hd.className = 'col-header';
  const titleEl = document.createElement('span');
  titleEl.className = 'col-title'; titleEl.textContent = COLS[colId] || colId;
  hd.appendChild(titleEl);
  const cnt = document.createElement('span');
  cnt.className = 'col-count'; cnt.textContent = visibleCards.length;
  hd.appendChild(cnt);
  const tog = document.createElement('button');
  tog.className = 'col-collapse';
  tog.title = collapseState[colId] ? 'Expand' : 'Collapse';
  tog.textContent = collapseState[colId] ? '+' : '-';
  tog.onclick = () => {
    collapseState[colId] = !collapseState[colId];
    localStorage.setItem('pd2kb-collapse', JSON.stringify(collapseState));
    col.classList.toggle('collapsed', !!collapseState[colId]);
    tog.textContent = collapseState[colId] ? '+' : '-';
    tog.title = collapseState[colId] ? 'Expand' : 'Collapse';
  };
  hd.appendChild(tog);
  col.appendChild(hd);

  const wrap = document.createElement('div');
  wrap.className = 'card-list-wrap';
  wrap.addEventListener('dragover', e => onDragOver(e, colId, wrap));
  wrap.addEventListener('drop', e => onDrop(e, colId));
  wrap.addEventListener('dragleave', e => { if (!wrap.contains(e.relatedTarget)) clearDropLines(wrap); });

  for (const card of allCards) {
    const cardEl = buildCard(card);
    const pillarHidden = filterPillars.size > 0 && !filterPillars.has(card.pillar);
    const flagHidden = filterFlaggedOnly && !card.flag;
    if (pillarHidden || flagHidden) cardEl.classList.add('filtered-out');
    wrap.appendChild(cardEl);
  }
  col.appendChild(wrap);

  const ft = document.createElement('div');
  ft.className = 'col-footer';
  const addBtn = document.createElement('button');
  addBtn.className = 'add-card-btn'; addBtn.textContent = '+ Add card';
  addBtn.onclick = () => openModal(null, colId);
  ft.appendChild(addBtn);
  col.appendChild(ft);
  return col;
}

function buildCard(card) {
  const el = document.createElement('div');
  el.className = 'card';
  el.dataset.id = card.id;
  el.draggable = true;
  el.style.borderLeftColor = pillarColor(card.pillar);

  const t = document.createElement('div');
  t.className = 'card-title'; t.textContent = card.title;
  el.appendChild(t);

  const meta = document.createElement('div');
  meta.className = 'card-meta';

  const p = getPillar(card.pillar);
  if (p) {
    const tag = document.createElement('span');
    tag.className = 'pillar-tag'; tag.style.background = p.color; tag.textContent = p.name;
    meta.appendChild(tag);
  }

  if (card.priority && PRIORITY[card.priority]) {
    const pri = PRIORITY[card.priority];
    const badge = document.createElement('span');
    badge.className = 'pri-badge pri-' + card.priority;
    badge.title = pri.label;
    badge.textContent = pri.short;
    meta.appendChild(badge);
  }

  el.appendChild(meta);

  if (card.notes) {
    const n = document.createElement('div');
    n.className = 'card-notes'; n.textContent = card.notes;
    el.appendChild(n);
  }

  const prog = subtaskProgress(card);
  if (prog !== null) {
    const progRow = document.createElement('div');
    progRow.className = 'st-progress';
    const pct = prog.total > 0 ? (prog.done / prog.total * 100) : 0;
    const barWrap = document.createElement('div');
    barWrap.className = 'st-bar-wrap';
    const barFill = document.createElement('div');
    barFill.className = 'st-bar-fill';
    barFill.style.width = pct + '%';
    barFill.style.background = pillarColor(card.pillar);
    barWrap.appendChild(barFill);
    progRow.appendChild(barWrap);
    const lbl = document.createElement('span');
    lbl.className = 'st-progress-lbl';
    lbl.textContent = prog.done + '/' + prog.total;
    lbl.title = expandedCards.has(card.id) ? 'Collapse subtasks' : 'Expand subtasks';
    progRow.appendChild(lbl);

    const toggleExpand = (e) => {
      e.stopPropagation();
      if (expandedCards.has(card.id)) { expandedCards.delete(card.id); } else { expandedCards.add(card.id); }
      saveExpandedState();
      renderBoard();
    };
    barWrap.onclick = toggleExpand;
    lbl.onclick = toggleExpand;
    el.appendChild(progRow);

    if (expandedCards.has(card.id)) {
      el.appendChild(buildInlineSubtaskList(card));
    }
  }

  // Flag badge (top-right corner, visible on hover or when flagged)
  const flagCfg = card.flag ? FLAG_CONFIG[card.flag] : null;
  const fBadge = document.createElement('button');
  fBadge.className = 'flag-badge' + (flagCfg ? ' flag-active ' + flagCfg.cls : '');
  fBadge.title = flagCfg ? ('Flagged: ' + flagCfg.label + ' - click to change') : 'Click to flag';
  fBadge.textContent = flagCfg ? flagCfg.icon : '★';
  if (flagCfg) el.classList.add('flagged-' + card.flag);
  fBadge.onclick = e => { e.stopPropagation(); toggleCardFlag(card.id); };
  el.appendChild(fBadge);

  el.onclick = () => openModal(card.id, null);
  el.addEventListener('contextmenu', e => showCtxMenu(e, card.id));

  el.addEventListener('dragstart', e => {
    if (draggedSubId) { e.preventDefault(); return; }
    draggedId = card.id;
    el.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', card.id);
  });

  el.addEventListener('dragend', () => {
    el.classList.remove('dragging');
    draggedId = null; dropTarget = null;
    document.querySelectorAll('.drop-line').forEach(d => d.remove());
  });

  return el;
}

function buildInlineSubtaskList(card) {
  const section = document.createElement('div');
  section.className = 'subtask-section';
  section.onclick = e => e.stopPropagation();

  const sorted = [...(card.subtasks || [])].sort((a, b) => a.order - b.order);

  for (const st of sorted) {
    section.appendChild(buildSubtaskItem(card, st, section));
  }

  section.addEventListener('dragover', e => {
    if (!draggedSubId) return;
    e.preventDefault(); e.stopPropagation();
    const items = [...section.querySelectorAll('.subtask-item:not(.st-dragging)')];
    let beforeSubId = null;
    let insertBefore = null;
    for (const item of items) {
      const rect = item.getBoundingClientRect();
      if (e.clientY < rect.top + rect.height / 2) {
        beforeSubId = item.dataset.stid;
        insertBefore = item;
        break;
      }
    }
    subDropTarget = {cardId: card.id, beforeSubId};
    section.querySelectorAll('.st-drop-line').forEach(d => d.remove());
    const line = document.createElement('div'); line.className = 'st-drop-line';
    if (insertBefore) section.insertBefore(line, insertBefore); else section.appendChild(line);
  });

  section.addEventListener('drop', e => {
    if (!draggedSubId) return;
    e.preventDefault(); e.stopPropagation();
    if (subDropTarget) {
      const parts = draggedSubId.split(':');
      moveSubtask(parts[0], parts[1], subDropTarget.beforeSubId);
    }
    section.querySelectorAll('.st-drop-line').forEach(d => d.remove());
    draggedSubId = null; subDropTarget = null;
  });

  section.addEventListener('dragleave', e => {
    if (!section.contains(e.relatedTarget)) section.querySelectorAll('.st-drop-line').forEach(d => d.remove());
  });

  const addBtn = document.createElement('button');
  addBtn.className = 'st-add-btn'; addBtn.textContent = '+ subtask';
  addBtn.onclick = e => { e.stopPropagation(); openModal(card.id, null, true); };
  section.appendChild(addBtn);

  return section;
}

function buildSubtaskItem(card, st, sectionEl) {
  const row = document.createElement('div');
  row.className = 'subtask-item';
  row.dataset.stid = st.id;
  row.draggable = true;

  const dot = document.createElement('button');
  dot.className = 'st-dot';
  dot.style.background = ST_COLORS[st.status] || '#94a3b8';
  dot.title = st.status;
  dot.onclick = e => {
    e.stopPropagation();
    const idx = ST_CYCLE.indexOf(st.status);
    st.status = ST_CYCLE[(idx + 1) % ST_CYCLE.length];
    dot.style.background = ST_COLORS[st.status];
    dot.title = st.status;
    textEl.className = 'st-text' + (st.status === 'done' ? ' st-done' : '');
    st.updated = now();
    scheduleSave();
  };
  row.appendChild(dot);

  const textEl = document.createElement('span');
  textEl.className = 'st-text' + (st.status === 'done' ? ' st-done' : '');
  textEl.textContent = st.title;
  row.appendChild(textEl);

  const handle = document.createElement('span');
  handle.className = 'st-handle'; handle.textContent = '::';
  row.appendChild(handle);

  row.onclick = e => e.stopPropagation();

  row.addEventListener('dragstart', e => {
    e.stopPropagation();
    draggedSubId = card.id + ':' + st.id;
    row.classList.add('st-dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', draggedSubId);
  });

  row.addEventListener('dragend', e => {
    e.stopPropagation();
    row.classList.remove('st-dragging');
    draggedSubId = null; subDropTarget = null;
    if (sectionEl) sectionEl.querySelectorAll('.st-drop-line').forEach(d => d.remove());
  });

  return row;
}

function moveSubtask(cardId, subtaskId, beforeSubId) {
  const card = getCard(cardId);
  if (!card || !card.subtasks) return;
  const st = card.subtasks.find(s => s.id === subtaskId);
  if (!st) return;

  const others = card.subtasks.filter(s => s.id !== subtaskId).sort((a, b) => a.order - b.order);

  if (beforeSubId === null) {
    st.order = others.length > 0 ? others[others.length - 1].order + 1000 : 1000;
  } else {
    const idx = others.findIndex(s => s.id === beforeSubId);
    const before = others[idx];
    const prev = idx > 0 ? others[idx - 1] : null;
    st.order = prev ? (prev.order + before.order) / 2 : before.order / 2;
  }

  st.updated = now();
  renderBoard();
  scheduleSave();
}

// ---------- card drag and drop ----------

function onDragOver(e, colId, wrap) {
  if (draggedSubId) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const cards = [...wrap.querySelectorAll('.card:not(.dragging):not(.filtered-out)')];
  let beforeId = null, insertBefore = null;
  for (const c of cards) {
    const rect = c.getBoundingClientRect();
    if (e.clientY < rect.top + rect.height / 2) { beforeId = c.dataset.id; insertBefore = c; break; }
  }
  dropTarget = {colId, beforeId};
  clearDropLines(wrap);
  const line = document.createElement('div'); line.className = 'drop-line';
  if (insertBefore) wrap.insertBefore(line, insertBefore); else wrap.appendChild(line);
}

function onDrop(e, colId) {
  if (draggedSubId) return;
  e.preventDefault();
  if (!draggedId || !dropTarget) return;
  moveCard(draggedId, dropTarget.colId, dropTarget.beforeId);
  clearDropLines(null); draggedId = null; dropTarget = null;
}

function clearDropLines(wrap) {
  (wrap || document).querySelectorAll('.drop-line').forEach(d => d.remove());
}

function moveCard(cardId, toCol, beforeId) {
  const card = getCard(cardId);
  if (!card) return;
  card.column = toCol;
  const colCards = sortedCards(state.cards.filter(c => c.id !== cardId && c.column === toCol));
  if (beforeId === null) {
    card.order = colCards.length > 0 ? colCards[colCards.length - 1].order + 1000 : 1000;
  } else {
    const idx = colCards.findIndex(c => c.id === beforeId);
    const before = colCards[idx];
    const prev = idx > 0 ? colCards[idx - 1] : null;
    card.order = prev ? (prev.order + before.order) / 2 : before.order / 2;
  }
  card.updated = now();
  renderBoard();
  scheduleSave();
}

// ---------- filter ----------

function toggleFilter(pillarId) {
  if (filterPillars.has(pillarId)) filterPillars.delete(pillarId); else filterPillars.add(pillarId);
  render();
}

// ---------- modal ----------

function openModal(cardId, defaultColId, focusSubtasks) {
  editingCardId = cardId;
  const isNew = cardId === null;
  document.getElementById('modal-title').textContent = isNew ? 'New card' : 'Edit card';
  document.getElementById('modal-delete-btn').style.display = isNew ? 'none' : '';

  const sel = document.getElementById('f-pillar');
  sel.innerHTML = '';
  for (const p of state.pillars) {
    const opt = document.createElement('option');
    opt.value = p.id; opt.textContent = p.name; sel.appendChild(opt);
  }

  if (isNew) {
    document.getElementById('f-title').value = '';
    document.getElementById('f-desc').value = '';
    document.getElementById('f-notes').value = '';
    document.getElementById('f-col').value = defaultColId || 'backlog';
    document.getElementById('f-priority').value = '';
    sel.value = state.pillars.length > 0 ? state.pillars[0].id : '';
    renderModalSubtasks([]);
  } else {
    const card = getCard(cardId);
    document.getElementById('f-title').value = card.title;
    document.getElementById('f-desc').value = card.description || '';
    document.getElementById('f-notes').value = card.notes || '';
    document.getElementById('f-col').value = card.column;
    document.getElementById('f-priority').value = card.priority != null ? card.priority : '';
    sel.value = card.pillar;
    renderModalSubtasks(card.subtasks || []);
  }

  document.getElementById('modal-overlay').classList.remove('hidden');
  if (focusSubtasks) {
    setTimeout(() => addSubtaskRow(), 50);
  } else {
    setTimeout(() => document.getElementById('f-title').focus(), 50);
  }
}

function renderModalSubtasks(subtasks) {
  const list = document.getElementById('modal-st-list');
  list.innerHTML = '';
  const sorted = [...subtasks].sort((a, b) => a.order - b.order);
  for (const st of sorted) appendModalSubtaskRow(st.id, st.title, st.status);
}

function appendModalSubtaskRow(id, title, status) {
  const list = document.getElementById('modal-st-list');
  const row = document.createElement('div');
  row.className = 'modal-st-row';
  if (id) row.dataset.stid = id;

  const sel = document.createElement('select');
  sel.className = 'modal-st-sel';
  for (const s of ['backlog','active','blocked','done']) {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s.charAt(0).toUpperCase() + s.slice(1);
    if (s === (status || 'backlog')) opt.selected = true;
    sel.appendChild(opt);
  }
  row.appendChild(sel);

  const inp = document.createElement('input');
  inp.type = 'text'; inp.className = 'modal-st-in';
  inp.value = title || ''; inp.placeholder = 'Subtask title';
  row.appendChild(inp);

  const del = document.createElement('button');
  del.className = 'modal-st-del'; del.textContent = 'x';
  del.type = 'button';
  del.onclick = () => row.remove();
  row.appendChild(del);

  list.appendChild(row);
  return inp;
}

function addSubtaskRow() {
  const inp = appendModalSubtaskRow(null, '', 'backlog');
  setTimeout(() => inp.focus(), 30);
}

function closeModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
  editingCardId = null;
}

function onOverlayClick(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

function saveCard() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { document.getElementById('f-title').focus(); return; }

  const colVal = document.getElementById('f-col').value;
  const pillarVal = document.getElementById('f-pillar').value;
  const desc = document.getElementById('f-desc').value.trim();
  const notes = document.getElementById('f-notes').value.trim();
  const priRaw = document.getElementById('f-priority').value;
  const priority = priRaw !== '' ? parseInt(priRaw, 10) : null;

  const stRows = [...document.getElementById('modal-st-list').querySelectorAll('.modal-st-row')];
  const subtasks = stRows.map((row, i) => {
    const stTitle = row.querySelector('.modal-st-in').value.trim();
    const stStatus = row.querySelector('.modal-st-sel').value;
    const stId = row.dataset.stid || newId();
    return {id: stId, title: stTitle, status: stStatus, order: (i + 1) * 1000, notes: ''};
  }).filter(s => s.title);

  if (editingCardId) {
    const card = getCard(editingCardId);
    const prevCol = card.column;
    card.title = title; card.description = desc; card.notes = notes;
    card.pillar = pillarVal; card.column = colVal;
    card.priority = priority;
    card.subtasks = subtasks;
    card.updated = now();
    if (colVal !== prevCol) {
      const colCards = sortedCards(state.cards.filter(c => c.id !== card.id && c.column === colVal));
      card.order = colCards.length > 0 ? colCards[colCards.length - 1].order + 1000 : 1000;
    }
  } else {
    const colCards = sortedCards(state.cards.filter(c => c.column === colVal));
    const order = colCards.length > 0 ? colCards[colCards.length - 1].order + 1000 : 1000;
    const n = now();
    state.cards.push({id: newId(), title, description: desc, pillar: pillarVal,
      column: colVal, order, priority, notes, subtasks, flag: null, flagged_at: null, created: n, updated: n});
  }

  closeModal();
  render();
  scheduleSave();
}

function deleteCard() {
  if (!editingCardId) return;
  if (!confirm('Delete this card?')) return;
  state.cards = state.cards.filter(c => c.id !== editingCardId);
  closeModal(); render(); scheduleSave();
}

async function toggleCardFlag(cardId) {
  const card = getCard(cardId);
  if (!card) return;
  const idx = FLAG_CYCLE.indexOf(card.flag || null);
  const next = FLAG_CYCLE[(idx + 1) % FLAG_CYCLE.length];
  card.flag = next;
  card.flagged_at = next ? now() : null;
  card.updated = now();
  renderBoard();
  try {
    const r = await fetch('/api/cards/' + cardId, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({flag: card.flag, flagged_at: card.flagged_at, updated: card.updated})
    });
    if (!r.ok) throw new Error('patch failed');
    setSaveStatus('saved', 'saved');
    setTimeout(() => setSaveStatus('', ''), 1200);
  } catch {
    scheduleSave();
  }
}

// ---------- settings ----------

function openSettings() {
  renderPillarList();
  const toggle = document.getElementById('auto-sort-toggle');
  if (toggle) toggle.checked = !!(state.settings && state.settings.autoSortPriority);
  document.getElementById('settings-panel').classList.add('open');
}

function closeSettings() {
  document.getElementById('settings-panel').classList.remove('open');
  inlineEditingPillarId = null;
}

function toggleAutoSort(val) {
  if (!state.settings) state.settings = {};
  state.settings.autoSortPriority = val;
  renderBoard();
  scheduleSave();
}

function renderPillarList() {
  const list = document.getElementById('pillar-list');
  if (!list || !state) return;
  list.innerHTML = '<div class="settings-pillars-hd">Pillars</div>';

  for (const p of state.pillars) {
    if (inlineEditingPillarId === p.id) {
      const form = document.createElement('div');
      form.className = 'pillar-inline-edit';
      const nameIn = document.createElement('input');
      nameIn.type = 'text'; nameIn.value = p.name; nameIn.id = 'edit-pname-' + p.id;
      form.appendChild(nameIn);
      const row = document.createElement('div');
      row.className = 'inline-edit-row';
      const cLbl = document.createElement('label'); cLbl.textContent = 'Color';
      const cIn = document.createElement('input');
      cIn.type = 'color'; cIn.value = p.color; cIn.id = 'edit-pcolor-' + p.id;
      row.appendChild(cLbl); row.appendChild(cIn);
      form.appendChild(row);
      const actions = document.createElement('div');
      actions.className = 'inline-edit-actions';
      const saveBtn = document.createElement('button');
      saveBtn.className = 'btn btn-primary btn-sm'; saveBtn.textContent = 'Save';
      saveBtn.onclick = () => savePillarEdit(p.id);
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'btn btn-ghost btn-sm'; cancelBtn.textContent = 'Cancel';
      cancelBtn.onclick = () => { inlineEditingPillarId = null; renderPillarList(); };
      const delBtn = document.createElement('button');
      delBtn.className = 'btn btn-danger btn-sm'; delBtn.textContent = 'Delete';
      delBtn.onclick = () => deletePillar(p.id);
      actions.appendChild(saveBtn); actions.appendChild(cancelBtn); actions.appendChild(delBtn);
      form.appendChild(actions);
      list.appendChild(form);
      setTimeout(() => nameIn.focus(), 30);
    } else {
      const cardCount = state.cards.filter(c => c.pillar === p.id).length;
      const row = document.createElement('div');
      row.className = 'pillar-row';
      const sw = document.createElement('div');
      sw.className = 'pillar-swatch'; sw.style.background = p.color;
      row.appendChild(sw);
      const nm = document.createElement('span');
      nm.className = 'pillar-row-name'; nm.textContent = p.name;
      row.appendChild(nm);
      const cnt = document.createElement('span');
      cnt.className = 'pillar-row-count'; cnt.textContent = cardCount;
      row.appendChild(cnt);
      const editBtn = document.createElement('button');
      editBtn.className = 'pillar-edit-btn'; editBtn.textContent = 'Edit';
      editBtn.onclick = () => { inlineEditingPillarId = p.id; renderPillarList(); };
      row.appendChild(editBtn);
      list.appendChild(row);
    }
  }
}

function savePillarEdit(pillarId) {
  const p = getPillar(pillarId);
  if (!p) return;
  const name = document.getElementById('edit-pname-' + pillarId).value.trim();
  const color = document.getElementById('edit-pcolor-' + pillarId).value;
  if (!name) return;
  p.name = name; p.color = color;
  inlineEditingPillarId = null;
  render(); scheduleSave();
}

function deletePillar(pillarId) {
  const count = state.cards.filter(c => c.pillar === pillarId).length;
  if (count > 0 && !confirm(`Delete pillar? ${count} card(s) will lose their pillar.`)) return;
  state.pillars = state.pillars.filter(p => p.id !== pillarId);
  state.cards.forEach(c => { if (c.pillar === pillarId) c.pillar = ''; });
  filterPillars.delete(pillarId);
  inlineEditingPillarId = null;
  render(); scheduleSave();
}

function addPillar() {
  const nameEl = document.getElementById('new-pillar-name');
  const colorEl = document.getElementById('new-pillar-color');
  const name = nameEl.value.trim();
  if (!name) { nameEl.focus(); return; }
  const id = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  if (state.pillars.find(p => p.id === id)) { alert('Pillar already exists.'); return; }
  state.pillars.push({id, name, color: colorEl.value});
  nameEl.value = '';
  render(); scheduleSave();
}

// ---------- keyboard ----------

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!document.getElementById('modal-overlay').classList.contains('hidden')) closeModal();
    else closeSettings();
  }
  if (e.key === 'Enter' && !document.getElementById('modal-overlay').classList.contains('hidden')) {
    if (e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'SELECT') { e.preventDefault(); saveCard(); }
  }
});

// ---------- tabs + parked sidebar + bugs ----------

let parkedData = null;
let bugsData = null;
let parkedFilters = {pillar: '', rcType: '', staleOnly: false};
let bugsFilters = {status: 'not-fixed', severity: ''};
let activeTab = 'kanban';
let ctxCardId = null;
let parkingCardId = null;
let expandedRows = new Set();
let readyBannerDismissed = false;

const sidebarPrefs = (() => {
  try { return JSON.parse(localStorage.getItem('pd2kb-sidebar') || '{}'); } catch { return {}; }
})();
if (typeof sidebarPrefs.parkedCollapsed !== 'boolean') sidebarPrefs.parkedCollapsed = false;

function saveSidebarPrefs() { localStorage.setItem('pd2kb-sidebar', JSON.stringify(sidebarPrefs)); }

function applySidebarState() {
  const sb = document.getElementById('parked-sidebar');
  if (!sb) return;
  sb.classList.toggle('collapsed', !!sidebarPrefs.parkedCollapsed);
  const btn = document.getElementById('sb-toggle-btn');
  if (btn) btn.title = sidebarPrefs.parkedCollapsed ? 'Show parked threads' : 'Hide parked threads';
}

function toggleParkedSidebar() {
  sidebarPrefs.parkedCollapsed = !sidebarPrefs.parkedCollapsed;
  saveSidebarPrefs();
  applySidebarState();
  if (!sidebarPrefs.parkedCollapsed) renderParked();
}

function openParkedSidebar() {
  sidebarPrefs.parkedCollapsed = false;
  saveSidebarPrefs();
  applySidebarState();
  renderParked();
}

function switchTab(name) {
  activeTab = name;
  for (const b of document.querySelectorAll('.tab-btn')) b.classList.toggle('active', b.dataset.tab === name);
  for (const p of document.querySelectorAll('#main-area > .panel')) p.classList.toggle('active', p.id === 'panel-' + name);
  if (name === 'bugs') renderBugs();
}

async function loadParked() {
  const r = await fetch('/api/parked');
  parkedData = await r.json();
  refreshTabCounts();
  refreshReadyBanner();
  if (!sidebarPrefs.parkedCollapsed) renderParked();
}

async function loadBugs() {
  const r = await fetch('/api/bugs');
  bugsData = await r.json();
  refreshTabCounts();
  if (activeTab === 'bugs') renderBugs();
}

function refreshTabCounts() {
  if (parkedData) {
    const total = (parkedData.parked || []).length;
    const ready = (parkedData.parked || []).filter(e => e.ready_to_resume).length;
    const badge = document.getElementById('sb-toggle-badge');
    if (badge) {
      badge.textContent = ready > 0 ? String(ready) : String(total);
      badge.classList.toggle('zero', ready === 0);
      badge.title = ready > 0 ? `${ready} ready to resume` : `${total} parked`;
    }
  }
  if (bugsData) {
    const total = (bugsData.bugs || []).length;
    const open = (bugsData.bugs || []).filter(b => b.status !== 'fixed').length;
    document.getElementById('bugs-tab-count').textContent = `(${open}/${total})`;
  }
}

function refreshReadyBanner() {
  if (!parkedData || readyBannerDismissed) return;
  const ready = (parkedData.parked || []).filter(e => e.ready_to_resume);
  const banner = document.getElementById('ready-banner');
  if (ready.length === 0) { banner.classList.remove('show'); return; }
  const noun = ready.length === 1 ? 'parked thread' : 'parked threads';
  document.getElementById('ready-banner-text').textContent =
    `${ready.length} ${noun} ready to resume - review?`;
  banner.classList.add('show');
}

function dismissReadyBanner() {
  readyBannerDismissed = true;
  document.getElementById('ready-banner').classList.remove('show');
}

/* ----------------- Daily-flow briefing banner ----------------- */

let briefingData = null;
let briefingDismissed = false;

async function loadBriefing() {
  try {
    const r = await fetch('/api/briefing');
    if (!r.ok) return;
    const text = await r.text();
    if (!text || text === '{}') return;
    briefingData = JSON.parse(text);
    renderBriefingBanner();
  } catch (e) {
    /* briefing is optional; silent fail */
  }
}

function renderBriefingBanner() {
  if (!briefingData) return;
  const banner = document.getElementById('df-briefing');
  if (briefingDismissed) {
    banner.classList.remove('show');
    document.getElementById('df-briefing-min').classList.add('show');
    return;
  }

  banner.classList.toggle('partial', !!briefingData.partial);

  const ts = briefingData.generated_display || '';
  const headlines = briefingData.headlines || [];
  const focus = briefingData.focus || [];
  const readyCount = briefingData.ready_to_resume ? briefingData.ready_to_resume.count : 0;
  const blockerCount = briefingData.blocker_bugs ? briefingData.blocker_bugs.count : 0;

  document.getElementById('df-briefing-time').textContent =
    `${ts}  ${briefingData.for_date || ''}` +
    (briefingData.partial ? '  PARTIAL RUN' : '');

  const headLines = headlines.slice(0, 3).map(h => `<div>- ${escapeHtml(h)}</div>`);
  const aux = [];
  if (readyCount > 0) aux.push(`<div>${readyCount} parked thread${readyCount === 1 ? '' : 's'} ready to resume</div>`);
  if (blockerCount > 0) aux.push(`<div>${blockerCount} blocker bug${blockerCount === 1 ? '' : 's'} open</div>`);
  document.getElementById('df-briefing-headlines').innerHTML = headLines.concat(aux).join('');

  const focusBits = focus.slice(0, 5).map(item => {
    const kind = item.kind || 'card';
    const id = escapeHtml(item.id || '');
    const title = escapeHtml(item.title || '');
    return `<span class="df-focus-pill kind-${kind}" title="${escapeHtml(item.rationale || '')}">[${kind}] ${id} ${title}</span>`;
  });
  document.getElementById('df-briefing-focus').innerHTML = focusBits.join('');

  banner.classList.add('show');
  document.getElementById('df-briefing-min').classList.remove('show');
}

function dismissBriefingBanner() {
  briefingDismissed = true;
  document.getElementById('df-briefing').classList.remove('show');
  document.getElementById('df-briefing-min').classList.add('show');
}

function restoreBriefingBanner() {
  briefingDismissed = false;
  renderBriefingBanner();
}

function escapeHtml(s) {
  return (s == null ? '' : String(s))
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function daysSince(isoDate) {
  if (!isoDate) return null;
  const d = new Date(isoDate + 'T00:00:00Z');
  const now = new Date();
  return Math.floor((now - d) / 86400000);
}

function pillarById(id) { return (state && state.pillars || []).find(p => p.id === id) || null; }

function renderParked() {
  if (!parkedData) return;
  const list = document.getElementById('parked-list');
  if (!list) return;
  list.innerHTML = '';

  // Update pillar filter options
  const pillarSel = document.getElementById('parked-filter-pillar');
  if (pillarSel.options.length <= 1 && state) {
    for (const p of state.pillars) {
      const o = document.createElement('option');
      o.value = p.id; o.textContent = p.name; pillarSel.appendChild(o);
    }
  }
  parkedFilters.pillar = pillarSel.value;
  parkedFilters.rcType = document.getElementById('parked-filter-rc').value;
  document.getElementById('parked-filter-stale').classList.toggle('active', parkedFilters.staleOnly);

  const entries = (parkedData.parked || []).filter(e => {
    if (parkedFilters.pillar && e.pillar !== parkedFilters.pillar) return false;
    const rc = (e.resume_condition || {}).type || 'manual';
    if (parkedFilters.rcType && rc !== parkedFilters.rcType) return false;
    if (parkedFilters.staleOnly && !e.stale) return false;
    return true;
  });

  const ready = entries.filter(e => e.ready_to_resume);
  const rest = entries.filter(e => !e.ready_to_resume);
  const stale = entries.filter(e => e.stale && !e.ready_to_resume);

  const totalAll = (parkedData.parked || []).length;
  const readyAll = (parkedData.parked || []).filter(e => e.ready_to_resume).length;
  const staleAll = (parkedData.parked || []).filter(e => e.stale).length;
  const counts = document.getElementById('sb-counts');
  if (counts) {
    counts.innerHTML = `${totalAll} <span class="ready-n">${readyAll}r</span> <span class="stale-n">${staleAll}s</span>`;
    counts.title = `${totalAll} parked - ${readyAll} ready - ${staleAll} stale`;
  }

  if (entries.length === 0) {
    list.innerHTML = '<div class="empty-state">No parked threads match the current filters.</div>';
    return;
  }

  if (ready.length > 0) list.appendChild(buildParkedSection('Ready', ready, 'ready'));
  const others = rest.filter(e => !e.stale);
  if (others.length > 0) list.appendChild(buildParkedSection('Parked', others, ''));
  if (stale.length > 0) list.appendChild(buildParkedSection('Stale', stale, 'stale'));
}

function buildParkedSection(title, items, cls) {
  const sec = document.createElement('div');
  sec.className = 'row-section' + (cls ? ' ' + cls : '');
  const h = document.createElement('div');
  h.className = 'row-section-head'; h.textContent = `${title} (${items.length})`;
  sec.appendChild(h);
  for (const e of items) sec.appendChild(buildParkedRow(e));
  return sec;
}

function buildParkedRow(entry) {
  const row = document.createElement('div');
  row.className = 'row';
  if (entry.ready_to_resume) row.classList.add('ready');
  if (entry.stale && !entry.ready_to_resume) row.classList.add('stale');
  if (expandedRows.has(entry.id)) row.classList.add('expanded');

  const top = document.createElement('div');
  top.className = 'row-top';
  const t = document.createElement('div'); t.className = 'row-title'; t.textContent = entry.title || entry.id;
  t.title = entry.title || entry.id;
  top.appendChild(t);

  const meta = document.createElement('div'); meta.className = 'row-meta';
  const pillar = pillarById(entry.pillar);
  if (pillar) {
    const b = document.createElement('span');
    b.className = 'badge badge-pillar'; b.style.background = pillar.color + '33';
    b.style.color = pillar.color; b.textContent = pillar.name;
    meta.appendChild(b);
  } else if (entry.pillar) {
    const b = document.createElement('span'); b.className = 'badge badge-pillar'; b.textContent = entry.pillar;
    meta.appendChild(b);
  }
  if (entry.ready_to_resume) {
    const b = document.createElement('span'); b.className = 'badge badge-ready'; b.textContent = 'Ready';
    meta.appendChild(b);
  } else if (entry.stale) {
    const b = document.createElement('span'); b.className = 'badge badge-stale'; b.textContent = 'Stale';
    meta.appendChild(b);
  }
  top.appendChild(meta);
  row.appendChild(top);

  const rc = entry.resume_condition || {};
  const idle = daysSince(entry.parked_date);
  const rcLine = document.createElement('div'); rcLine.className = 'row-rc';
  rcLine.textContent = (idle != null ? `${idle}d - ` : '') + describeRC(rc);
  rcLine.title = `Parked ${entry.parked_date} - Resume: ${describeRC(rc)}`;
  row.appendChild(rcLine);

  const actions = document.createElement('div'); actions.className = 'row-actions';
  actions.appendChild(mkIconBtn('Unpark', 'primary', 'Restore to active kanban', e => { e.stopPropagation(); unparkRow(entry.id); }));
  actions.appendChild(mkIconBtn('Done', '', 'Mark complete (archive without restoring)', e => { e.stopPropagation(); completeRow(entry.id); }));
  actions.appendChild(mkIconBtn('Del', 'danger', 'Delete (permanent)', e => { e.stopPropagation(); deleteRow(entry.id); }));
  row.appendChild(actions);

  const detail = document.createElement('div'); detail.className = 'row-detail';
  if (entry.last_state_snapshot) {
    const p = document.createElement('pre'); p.textContent = entry.last_state_snapshot;
    detail.appendChild(p);
  }
  const refs = entry.context_refs || [];
  if (refs.length > 0) {
    const r = document.createElement('div'); r.className = 'detail-row';
    const l = document.createElement('span'); l.className = 'detail-label'; l.textContent = 'Context'; r.appendChild(l);
    refs.forEach((ref, i) => {
      if (i > 0) r.appendChild(document.createTextNode(', '));
      const a = document.createElement('a'); a.href = '#'; a.textContent = ref;
      a.onclick = e => { e.preventDefault(); window.prompt('Open this path in your editor:', ref); };
      r.appendChild(a);
    });
    detail.appendChild(r);
  }
  if (entry.tags && entry.tags.length > 0) {
    const r = document.createElement('div'); r.className = 'detail-row';
    const l = document.createElement('span'); l.className = 'detail-label'; l.textContent = 'Tags'; r.appendChild(l);
    r.appendChild(document.createTextNode(entry.tags.join(', ')));
    detail.appendChild(r);
  }
  row.appendChild(detail);

  row.onclick = () => {
    if (expandedRows.has(entry.id)) expandedRows.delete(entry.id); else expandedRows.add(entry.id);
    row.classList.toggle('expanded');
  };
  return row;
}

function describeRC(rc) {
  if (!rc || !rc.type) return 'manual';
  if (rc.type === 'date') return `date ${rc.targets || '(unset)'}`;
  if (rc.type === 'dependency') {
    const targets = Array.isArray(rc.targets) ? rc.targets : [];
    const labels = targets.map(cid => {
      const c = state && state.cards.find(x => x.id === cid);
      const status = c ? c.column : '?';
      return `${cid}:${status}`;
    });
    const sem = rc.semantics === 'any-of' ? ' (any)' : '';
    return `dependency on ${labels.join(', ')}${sem}`;
  }
  if (rc.type === 'manual') return 'manual';
  return rc.type;
}

function mkBtn(label, cls, handler) {
  const b = document.createElement('button');
  b.className = 'btn ' + cls + ' btn-sm';
  b.textContent = label; b.onclick = handler; return b;
}

function mkIconBtn(label, cls, tooltip, handler) {
  const b = document.createElement('button');
  b.className = 'btn-icon' + (cls ? ' ' + cls : '');
  b.textContent = label; b.title = tooltip || label; b.onclick = handler; return b;
}

function toggleParkedStale() {
  parkedFilters.staleOnly = !parkedFilters.staleOnly;
  renderParked();
}

async function unparkRow(pid) {
  if (!confirm('Unpark this thread? It will be restored to the active kanban.')) return;
  await fetch('/api/unpark', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({parked_id: pid})});
  await Promise.all([loadParked(), loadState()]);
}

async function completeRow(pid) {
  if (!confirm('Mark complete (archive without restoring)?')) return;
  await fetch('/api/parked/complete', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({parked_id: pid})});
  await loadParked();
}

async function deleteRow(pid) {
  if (!confirm('Permanently delete? This cannot be undone.')) return;
  await fetch('/api/parked/delete', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({parked_id: pid})});
  await loadParked();
}

async function runEvaluator() {
  setSaveStatus('saving', 'evaluating...');
  try {
    const r = await fetch('/api/evaluate', {method:'POST'});
    const j = await r.json();
    setSaveStatus('saved', `evaluator: ${(j.ready_flipped||[]).length} ready, ${(j.newly_stale||[]).length} newly stale`);
    setTimeout(() => setSaveStatus('', ''), 2500);
    readyBannerDismissed = false;
    await loadParked();
  } catch (e) {
    setSaveStatus('', 'evaluator failed');
  }
}

// ---------- bugs panel ----------

function renderBugs() {
  if (!bugsData) return;
  const list = document.getElementById('bugs-list');
  list.innerHTML = '';
  bugsFilters.status = document.getElementById('bugs-filter-status').value;
  bugsFilters.severity = document.getElementById('bugs-filter-sev').value;

  const sevOrder = {blocker:0, major:1, minor:2};
  let entries = [...(bugsData.bugs || [])].sort((a, b) => {
    const sa = sevOrder[a.severity] != null ? sevOrder[a.severity] : 99;
    const sb = sevOrder[b.severity] != null ? sevOrder[b.severity] : 99;
    if (sa !== sb) return sa - sb;
    return (a.id || '').localeCompare(b.id || '');
  });
  entries = entries.filter(b => {
    if (bugsFilters.status === 'not-fixed' && b.status === 'fixed') return false;
    if (bugsFilters.status && bugsFilters.status !== 'not-fixed' && bugsFilters.status !== 'all' && b.status !== bugsFilters.status) return false;
    if (bugsFilters.severity && b.severity !== bugsFilters.severity) return false;
    return true;
  });

  const total = (bugsData.bugs || []).length;
  const open = (bugsData.bugs || []).filter(b => b.status !== 'fixed').length;
  document.getElementById('bugs-count').innerHTML = `${total} total - ${open} non-fixed`;

  if (entries.length === 0) {
    list.innerHTML = '<div class="empty-state">No bugs match the current filters.</div>';
    return;
  }

  for (const bug of entries) list.appendChild(buildBugRow(bug));
}

function buildBugRow(bug) {
  const row = document.createElement('div');
  row.className = 'row bug-row';
  if (expandedRows.has(bug.id)) row.classList.add('expanded');
  // Severity drives the left border tint (matches the parked row treatment).
  if (bug.severity === 'blocker') row.style.borderLeftColor = '#ef4444';
  else if (bug.severity === 'major') row.style.borderLeftColor = '#f97316';
  else row.style.borderLeftColor = '#64748b';

  const top = document.createElement('div'); top.className = 'row-top';
  const idEl = document.createElement('span'); idEl.className = 'row-id'; idEl.textContent = bug.id;
  top.appendChild(idEl);
  const t = document.createElement('div'); t.className = 'row-title'; t.textContent = bug.title || '';
  t.title = bug.title || '';
  top.appendChild(t);

  const meta = document.createElement('div'); meta.className = 'row-meta';
  const sev = document.createElement('span'); sev.className = 'badge badge-sev-' + (bug.severity || 'minor'); sev.textContent = (bug.severity || 'minor').slice(0,3).toUpperCase();
  sev.title = bug.severity || 'minor';
  meta.appendChild(sev);
  const st = document.createElement('span'); st.className = 'badge badge-status-' + (bug.status || 'open');
  st.textContent = statusShort(bug.status || 'open');
  st.title = bug.status || 'open';
  meta.appendChild(st);
  if (bug.linked_test) {
    const lt = document.createElement('span'); lt.textContent = 'T'; lt.title = 'Linked test: ' + bug.linked_test;
    lt.className = 'badge'; lt.style.background = '#0e7490'; lt.style.color = 'white';
    meta.appendChild(lt);
  }
  const rb = (bug.related_bugs || []).length;
  if (rb > 0) {
    const r = document.createElement('span'); r.textContent = `+${rb}`; r.title = `${rb} related: ${(bug.related_bugs||[]).join(', ')}`;
    meta.appendChild(r);
  }
  top.appendChild(meta);
  row.appendChild(top);

  const actions = document.createElement('div'); actions.className = 'row-actions';
  for (const next of ['open','triaged','fix-pending-verification','fixed']) {
    if (next === bug.status) continue;
    actions.appendChild(mkIconBtn(statusShort(next), '', 'Flip status to ' + next, e => { e.stopPropagation(); flipBugStatus(bug.id, next); }));
  }
  actions.appendChild(mkIconBtn('Link', '', 'Link or edit linked smoke-verify test', e => { e.stopPropagation(); linkBugTest(bug.id, bug.linked_test); }));
  row.appendChild(actions);

  const detail = document.createElement('div'); detail.className = 'row-detail';
  if (bug.repro) {
    const r = document.createElement('div'); r.className = 'detail-row';
    const l = document.createElement('span'); l.className = 'detail-label'; l.textContent = 'Repro'; r.appendChild(l);
    const p = document.createElement('pre'); p.textContent = bug.repro; r.appendChild(p);
    detail.appendChild(r);
  }
  if (bug.root_cause_file_lines && bug.root_cause_file_lines.length > 0) {
    const r = document.createElement('div'); r.className = 'detail-row';
    const l = document.createElement('span'); l.className = 'detail-label'; l.textContent = 'Root cause'; r.appendChild(l);
    bug.root_cause_file_lines.forEach((line, i) => {
      if (i > 0) r.appendChild(document.createTextNode(', '));
      const a = document.createElement('a'); a.href = '#'; a.textContent = line;
      a.onclick = e => { e.preventDefault(); window.prompt('Open this path:', line); };
      r.appendChild(a);
    });
    detail.appendChild(r);
  }
  if (bug.linked_test) {
    const r = document.createElement('div'); r.className = 'detail-row';
    const l = document.createElement('span'); l.className = 'detail-label'; l.textContent = 'Linked test'; r.appendChild(l);
    r.appendChild(document.createTextNode(bug.linked_test));
    detail.appendChild(r);
  }
  if (bug.fix_commit) {
    const r = document.createElement('div'); r.className = 'detail-row';
    const l = document.createElement('span'); l.className = 'detail-label'; l.textContent = 'Fix commit'; r.appendChild(l);
    r.appendChild(document.createTextNode(`${bug.fix_commit}${bug.fixed_date ? ' (' + bug.fixed_date + ')' : ''}`));
    detail.appendChild(r);
  }
  if (bug.related_bugs && bug.related_bugs.length > 0) {
    const r = document.createElement('div'); r.className = 'detail-row';
    const l = document.createElement('span'); l.className = 'detail-label'; l.textContent = 'Related'; r.appendChild(l);
    r.appendChild(document.createTextNode(bug.related_bugs.join(', ')));
    detail.appendChild(r);
  }
  if (bug.x_notes) {
    const r = document.createElement('div'); r.className = 'detail-row';
    const l = document.createElement('span'); l.className = 'detail-label'; l.textContent = 'Notes'; r.appendChild(l);
    const p = document.createElement('pre'); p.textContent = bug.x_notes; r.appendChild(p);
    detail.appendChild(r);
  }
  row.appendChild(detail);

  row.onclick = () => {
    if (expandedRows.has(bug.id)) expandedRows.delete(bug.id); else expandedRows.add(bug.id);
    row.classList.toggle('expanded');
  };
  return row;
}

function statusShort(s) {
  switch (s) {
    case 'open': return 'open';
    case 'triaged': return 'tri';
    case 'fix-pending-verification': return 'pending';
    case 'fixed': return 'fixed';
    default: return s || '?';
  }
}

async function flipBugStatus(bid, status) {
  const patch = {status};
  if (status === 'fixed') patch.fixed_date = new Date().toISOString().slice(0, 10);
  await fetch('/api/bugs/update', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({bug_id: bid, patch})});
  await loadBugs();
}

async function linkBugTest(bid, current) {
  const path = window.prompt('Linked test path (e.g. tools/smoke-verify/tests/bugs/' + bid + '.json):', current || ('tools/smoke-verify/tests/bugs/' + bid + '.json'));
  if (path === null) return;
  await fetch('/api/bugs/update', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({bug_id: bid, patch: {linked_test: path || null}})});
  await loadBugs();
}

// ---------- bug add modal ----------

function openBugModal() {
  document.getElementById('bug-f-id').value = '';
  document.getElementById('bug-f-title').value = '';
  document.getElementById('bug-f-severity').value = 'major';
  document.getElementById('bug-f-status').value = 'open';
  document.getElementById('bug-f-linked-test').value = '';
  document.getElementById('bug-f-repro').value = '';
  document.getElementById('bug-f-root-cause').value = '';
  document.getElementById('bug-f-related').value = '';
  document.getElementById('bug-modal-overlay').classList.add('show');
  setTimeout(() => document.getElementById('bug-f-id').focus(), 50);
}

function closeBugModal() {
  document.getElementById('bug-modal-overlay').classList.remove('show');
}

async function confirmBugAdd() {
  const id = document.getElementById('bug-f-id').value.trim();
  const title = document.getElementById('bug-f-title').value.trim();
  if (!id || !title) { alert('Bug ID and title required.'); return; }
  const root = document.getElementById('bug-f-root-cause').value.trim()
    .split('\n').map(s => s.trim()).filter(Boolean);
  const related = document.getElementById('bug-f-related').value.trim()
    .split(',').map(s => s.trim()).filter(Boolean);
  const bug = {
    id, title,
    severity: document.getElementById('bug-f-severity').value,
    status: document.getElementById('bug-f-status').value,
    repro: document.getElementById('bug-f-repro').value.trim(),
    root_cause_file_lines: root,
    linked_test: document.getElementById('bug-f-linked-test').value.trim() || null,
    related_bugs: related
  };
  const r = await fetch('/api/bugs/add', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({bug})});
  if (!r.ok) { const j = await r.json().catch(() => ({})); alert('Failed: ' + (j.error || r.statusText)); return; }
  closeBugModal();
  await loadBugs();
}

// ---------- right-click context menu on kanban cards ----------

function showCtxMenu(e, cardId) {
  e.preventDefault();
  ctxCardId = cardId;
  const m = document.getElementById('ctx-menu');
  m.classList.add('show');
  const x = Math.min(e.clientX, window.innerWidth - 200);
  const y = Math.min(e.clientY, window.innerHeight - 120);
  m.style.left = x + 'px';
  m.style.top = y + 'px';
}

function hideCtxMenu() {
  document.getElementById('ctx-menu').classList.remove('show');
  ctxCardId = null;
}

function ctxParkAction() {
  if (!ctxCardId) return;
  parkingCardId = ctxCardId;
  hideCtxMenu();
  openParkModal();
}

function ctxOpenAction() {
  if (!ctxCardId) return;
  const id = ctxCardId;
  hideCtxMenu();
  openModal(id, null);
}

function ctxFlagAction() {
  if (!ctxCardId) return;
  const id = ctxCardId;
  hideCtxMenu();
  toggleCardFlag(id);
}

document.addEventListener('click', () => hideCtxMenu());
document.addEventListener('scroll', () => hideCtxMenu(), true);

// ---------- park modal ----------

function openParkModal() {
  const card = getCard(parkingCardId);
  document.getElementById('park-modal-title').textContent = 'Park: ' + (card ? card.title : parkingCardId);
  document.getElementById('park-rc-type').value = 'date';
  const today = new Date();
  today.setDate(today.getDate() + 30);
  document.getElementById('park-rc-date').value = today.toISOString().slice(0, 10);
  document.getElementById('park-rc-dep').value = '';
  document.getElementById('park-note').value = '';
  onParkTypeChange();
  document.getElementById('park-modal-overlay').classList.add('show');
}

function closeParkModal() {
  document.getElementById('park-modal-overlay').classList.remove('show');
  parkingCardId = null;
}

function onParkTypeChange() {
  const t = document.getElementById('park-rc-type').value;
  document.getElementById('park-rc-date-row').style.display = (t === 'date') ? '' : 'none';
  document.getElementById('park-rc-dep-row').style.display = (t === 'dependency') ? '' : 'none';
}

async function confirmPark() {
  if (!parkingCardId) return;
  const t = document.getElementById('park-rc-type').value;
  let rc = {type: t, targets: null, semantics: 'all-of'};
  if (t === 'date') {
    rc.targets = document.getElementById('park-rc-date').value;
    if (!rc.targets) { alert('Pick a date.'); return; }
  } else if (t === 'dependency') {
    const raw = document.getElementById('park-rc-dep').value.trim();
    if (!raw) { alert('At least one card id required.'); return; }
    rc.targets = raw.split(',').map(s => s.trim()).filter(Boolean);
  }
  const note = document.getElementById('park-note').value.trim();
  const r = await fetch('/api/park', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({card_id: parkingCardId, resume_condition: rc, note})});
  if (!r.ok) { const j = await r.json().catch(() => ({})); alert('Park failed: ' + (j.error || r.statusText)); return; }
  closeParkModal();
  await Promise.all([loadParked(), loadState()]);
  setSaveStatus('saved', 'parked'); setTimeout(() => setSaveStatus('', ''), 1500);
}

// ---------- boot ----------

applySidebarState();

Promise.all([
  loadState(),
  loadParked(),
  loadBugs(),
  loadBriefing()
]).catch(err => {
  document.getElementById('board').innerHTML =
    '<p style="color:#ef4444;padding:20px">Failed to load state: ' + err.message +
    '. Is server.py running on port 7531?</p>';
});
</script>
</body>
